<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · comp.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2250%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Georgia,serif%22 fill=%22white%22 text-anchor=%22middle%22%3Ec.%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="loading">
<header class="top"><a class="label" href="home.html">Menu</a><a class="brand" href="home.html">comp.</a><a class="label" href="profile.html">Profile</a></header>
<main>
  <section>
    <h1 id="p-name" class="name"></h1>
    <p id="p-school" class="muted"></p>
    <ul id="p-clubs" class="tags"></ul>
    <a class="button secondary no-print" href="edit-profile.html">Edit profile</a>
  </section>

  <section>
    <div class="big"><span id="total">0</span> / <span id="goal-out">160</span> hours</div>
    <progress id="bar" class="no-print" max="160" value="0"></progress>
    <p id="left" class="no-print"></p>
  </section>

  <section>
    <h2>Your hours</h2>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Organization</th><th>Activity</th><th>Hours</th><th>Supervisor</th>
          <th class="print-only">Supervisor signature</th><th class="no-print"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted no-print">No hours logged yet. <a href="log.html">Log some</a></p>
    <div class="row no-print">
      <button id="print">Print sign-off sheet</button>
      <button id="csv" class="secondary">Download CSV</button>
    </div>
    <p class="print-only"><br>Student signature ______________________ &nbsp; Date __________</p>
  </section>

  <p id="msg" role="status" class="no-print"></p>
  <p id="who" class="muted no-print"></p>
  <button id="import" class="secondary no-print" hidden></button>
  <p class="no-print"><a class="label" href="club.html">I'm a club leader →</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
