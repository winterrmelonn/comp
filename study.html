<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study · comp.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2256%22 font-weight=%22700%22 font-family=%22Inter,Arial,sans-serif%22 fill=%22white%22 text-anchor=%22middle%22%3Ec.%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="theme.js"></script>
</head>
<body>
<script src="shell.js"></script>
<main>
  <div class="page-head">
    <h1>Study</h1>
    <p class="muted">A study plan and the best free resources for every AP course, the SAT, PSAT, ACT and CLEP, plus official exam and test dates you can add to your calendar.</p>
  </div>
  <div class="disc-bar study-bar">
    <label class="search-box"><span class="sr-only">Search</span><input id="s-q" type="search" placeholder="Search: calculus, SAT, Spanish…" autocomplete="off"></label>
    <button id="s-mine" type="button" class="secondary" aria-pressed="false">My exams only</button>
  </div>
  <div id="s-groups" class="tabs" role="group" aria-label="Subject group"></div>
  <p id="s-count" class="muted" style="font-size:13px"></p>
  <div id="study" class="study-grid"></div>
  <p id="s-empty" class="muted" hidden>Nothing matches that search.</p>
  <p id="msg" role="status"></p>
</main>
<script src="study.js"></script>
</body>
</html>
