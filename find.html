<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find opportunities · comp.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2250%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Georgia,serif%22 fill=%22white%22 text-anchor=%22middle%22%3Ec.%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="shell.js"></script>
<main>
  <h1>Find opportunities</h1>

  <section id="post-section" hidden>
    <h2>Post an opportunity</h2>
    <form id="post-form" class="grid">
      <label>Club <select name="club_id" required></select></label>
      <label>Type <select name="kind">
        <option value="volunteer">Volunteer event</option>
        <option value="scholarship">Scholarship</option>
        <option value="program">Program / extracurricular</option>
      </select></label>
      <label>Title <input name="title" required></label>
      <label id="date-label">Date <input name="date" type="date" required></label>
      <label id="time-field">Time <input name="time" placeholder="9am–12pm"></label>
      <label id="location-field">Location <input name="location"></label>
      <label id="amount-field" hidden>Amount ($) <input name="amount" type="number" min="0" step="any"></label>
      <label>Link <input name="link" inputmode="url" placeholder="https://"></label>
      <label class="wide">Details <textarea name="details" rows="3"></textarea></label>
      <div><button>Post</button></div>
    </form>
  </section>

  <p id="msg" role="status"></p>
  <section>
    <label class="search">Search <input id="find-q" type="search" placeholder="Event, club, place…" autocomplete="off"></label>
    <div id="kind-filters" class="chips"></div>
    <div id="posts"></div>
    <p id="empty" class="muted" hidden>No upcoming opportunities yet.</p>
  </section>
  <p id="leader-hint" class="muted">Run a club? <a href="club.html">Register it</a> to post opportunities here.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="track.js"></script>
<script src="app.js"></script>
</body>
</html>
