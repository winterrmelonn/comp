<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit profile · comp.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2250%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Georgia,serif%22 fill=%22white%22 text-anchor=%22middle%22%3Ec.%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="shell.js"></script>
<main class="narrow">
  <h1>Edit profile</h1>
  <form id="profile-form" class="stack">
    <label>Name <input name="name" autocomplete="name" required></label>
    <label>School <input name="school"></label>
    <label>Instagram <input name="instagram" placeholder="@yourhandle" autocapitalize="off"></label>

    <h2>Clubs</h2>
    <div id="memberships"></div>
    <button type="button" id="add-club" class="secondary">Add a club</button>

    <button>Save</button>
  </form>
  <p id="msg" role="status"></p>
</main>

<template id="membership-row">
  <div class="membership">
    <label class="wide">Club <input data-k="club"></label>
    <label class="wide">Role <input data-k="role" placeholder="Member, Treasurer…"></label>
    <label>From <select data-k="start"></select></label>
    <label>To <select data-k="end"></select></label>
    <button type="button" class="secondary remove">Remove</button>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
