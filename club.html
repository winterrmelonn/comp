<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2250%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Georgia,serif%22 fill=%22white%22 text-anchor=%22middle%22%3Ec.%3C/text%3E%3C/svg%3E">

<body>
<header class="top"><a class="label" href="home.html">Menu</a><a class="brand" href="home.html">comp.</a><a class="label" href="profile.html">Profile</a></header>
<main class="narrow">
  <h1>Register your club</h1>
  <p class="muted">Club leaders can post volunteer events on Find opportunities.</p>
  <section id="my-clubs-section" hidden>
    <h2>Clubs you lead</h2>
    <ul id="my-clubs" class="tags"></ul>
  </section>
  <form id="club-form" class="stack">
    <label>Club name <input name="name" required></label>
    <label>What the club does <textarea name="description" rows="3"></textarea></label>
    <label>When and where you meet <input name="meets" placeholder="Tuesdays at lunch, Room 204"></label>
    <label>Contact (email or Instagram) <input name="contact"></label>
    <button>Register club</button>
  </form>
  <p id="msg" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
