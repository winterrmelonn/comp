<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log hours · comp.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2250%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Georgia,serif%22 fill=%22white%22 text-anchor=%22middle%22%3Ec.%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="theme.js"></script>
</head>
<body>
<script src="shell.js"></script>
<main>
  <section>
    <h1 id="title">Log volunteer hours</h1>
    <form id="form" class="grid">
      <label>Date <input name="date" type="date" required></label>
      <label>Organization <input name="org" list="orgs" required></label>
      <label>What you did <input name="activity"></label>
      <label>Hours <input name="hours" type="number" min="0.25" max="24" step="0.25" required></label>
      <label>Supervisor name <input name="supervisor"></label>
      <label>Supervisor email or phone <input name="contact"></label>
      <label id="photo-field" class="wide">Photo <input name="photo" type="file" accept="image/*">
        <img id="photo-preview" class="photo-preview" alt="" hidden>
      </label>
      <div><button>Add hours</button></div>
    </form>
    <datalist id="orgs"></datalist>
    <p id="msg" role="status"></p>
    <p id="who" class="muted"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
