<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log hours · comp.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><a class="label" href="home.html">Menu</a><a class="brand" href="home.html">comp.</a><a class="label" href="profile.html">Profile</a></header>
<main>
  <section>
    <h1>Log volunteer hours</h1>
    <form id="form" class="grid">
      <label>Date <input name="date" type="date" required></label>
      <label>Organization <input name="org" list="orgs" required></label>
      <label>What you did <input name="activity"></label>
      <label>Hours <input name="hours" type="number" min="0.25" max="24" step="0.25" required></label>
      <label>Supervisor name <input name="supervisor"></label>
      <label>Supervisor email or phone <input name="contact"></label>
      <div><button>Add hours</button></div>
    </form>
    <datalist id="orgs"></datalist>
    <p id="msg" role="status"></p>
    <p id="who" class="muted"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
